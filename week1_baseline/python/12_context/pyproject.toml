[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boukensha"
version = "0.12.0"
description = "Python port of the Boukensha 12_context step (context-window tracking, auto-compaction, and reasoning normalization)."
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "textual>=0.60",
    # Tracing. The proto-http exporter (not proto-grpc) because Langfuse — and
    # the collector profiles in week2_capable/observability — accept OTLP over
    # HTTP; Langfuse does not support gRPC at all.
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
boukensha = "boukensha_loader:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["boukensha", "boukensha_loader.py"]

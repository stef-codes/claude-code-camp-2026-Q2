[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boukensha"
version = "0.10.0"
description = "Python port of the Boukensha 10_standard_tool_library step (MCP host — the agent's only tools are MCP servers)."
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
boukensha = "boukensha_loader:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["boukensha", "boukensha_loader.py"]

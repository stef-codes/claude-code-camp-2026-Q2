[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boukensha"
version = "0.1.0"
description = "Python port of the Boukensha 06_the_logger step (structured JSONL session logs)."
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["boukensha"]
